name: ai-engine-ci

on:
  pull_request:
    paths:
      - "apps/ai-engine/**"
      - ".github/workflows/ai-engine-ci.yml"
  push:
    branches: [main, prod]
    paths:
      - "apps/ai-engine/**"

defaults:
  run:
    working-directory: apps/ai-engine

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ai-engine/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest
