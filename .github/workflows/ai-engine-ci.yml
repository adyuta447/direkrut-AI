name: ai-engine-ci

on:
  pull_request:
    paths:
      - "apps/ai-engine/**"
      - ".github/workflows/ai-engine-ci.yml"
  push:
    branches: [main, prod]
    paths:
      - "apps/ai-engine/**"

defaults:
  run:
    working-directory: apps/ai-engine

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ai-engine/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Build & push container image
        working-directory: apps/ai-engine
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:push web -a direkrut-ai-ai-engine

      - name: Release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:release web -a direkrut-ai-ai-engine
