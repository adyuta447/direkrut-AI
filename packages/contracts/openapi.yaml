# Kontrak API bersama buat ketiga layanan (apps/web, apps/api-go,
# apps/ai-engine). Ini sumber kebenaran tunggal soal bentuk request/
# response — kalau berubah, update di sini dulu baru sinkronkan ke
# implementasi. Nantinya bisa dipakai buat generate TypeScript types
# (openapi-typescript) dan Go structs (oapi-codegen).
openapi: 3.0.3
info:
  title: Direkrut AI API
  description: >
    Kontrak REST API buat Direkrut AI. Endpoint /v1/* dilayani oleh
    apps/api-go (logika bisnis); endpoint /internal/* dilayani oleh
    apps/ai-engine dan hanya dipanggil server-to-server oleh api-go.
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: apps/api-go (lokal)
  - url: http://localhost:8000
    description: apps/ai-engine (lokal, internal only)

tags:
  - name: auth
  - name: jobs
  - name: applications
  - name: subscriptions
  - name: payments

paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Layanan hidup
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Daftar akun baru (kandidat atau HRD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Masuk dengan email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /v1/jobs:
    get:
      tags: [jobs]
      summary: List lowongan (dengan filter)
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daftar lowongan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      tags: [jobs]
      summary: Buat lowongan baru (HRD, kena kuota subscription tier)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Lowongan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /v1/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Detail satu lowongan
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail lowongan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /v1/applications:
    post:
      tags: [applications]
      summary: Kirim lamaran (upload CV)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Lamaran diterima, masuk antrean AI screening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /v1/subscriptions/me:
    get:
      tags: [subscriptions]
      summary: Tier subscription aktif + sisa kuota
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Info subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /internal/cv-parser/parse:
    post:
      tags: [ai-engine]
      summary: "[internal] Parsing CV jadi data terstruktur"
      responses:
        "200":
          description: Hasil parsing CV

  /internal/vector-search/match:
    post:
      tags: [ai-engine]
      summary: "[internal] Cosine similarity antara CV dan lowongan"
      responses:
        "200":
          description: Skor kecocokan + bukti kutipan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [applicant, hrd]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        type:
          type: string
        description:
          type: string
        department:
          type: string
        requirements:
          type: array
          items:
            type: string
        detailedQualifications:
          type: array
          items:
            type: string
        salaryRange:
          type: string
        industry:
          type: string
        questions:
          type: array
          items:
            type: string
        posted:
          type: string
        applicantCount:
          type: integer

    JobInput:
      allOf:
        - $ref: "#/components/schemas/Job"
      description: Sama seperti Job, tanpa field id dan applicantCount.

    Application:
      type: object
      properties:
        id:
          type: string
        applicantId:
          type: string
        applicantName:
          type: string
        jobId:
          type: string
        jobTitle:
          type: string
        validationStatus:
          type: string
          enum: [pending, in-progress, completed]
        status:
          type: string
          enum: [submitted, under-review, interview, rejected]
        recommendationScore:
          type: number
        appliedDate:
          type: string
          format: date-time

    ApplicationInput:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
        resumeLink:
          type: string
        email:
          type: string
        phone:
          type: string

    Subscription:
      type: object
      properties:
        tier:
          type: string
          enum: [free, pro, pro_plus, max]
        jobPostingsUsed:
          type: integer
        jobPostingsLimit:
          type: integer
          nullable: true
        cvStorageUsedMb:
          type: number
        cvStorageLimitMb:
          type: number
          nullable: true
