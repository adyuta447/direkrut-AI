[mypy]

# boto3/botocore & google-generativeai gak nyediain type stubs (py.typed)
# -- ini bukan bug di kode kita, cuma keterbatasan paket pihak ketiga.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

# onnxruntime & tokenizers juga gak nyediain py.typed -- sama kayak di atas,
# keterbatasan paket pihak ketiga, bukan bug di kode kita.
[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-tokenizers.*]
ignore_missing_imports = True
