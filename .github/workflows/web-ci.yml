name: web-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main, prod]
    paths:
      - "apps/web/**"

defaults:
  run:
    working-directory: apps/web

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: apps/web/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn build

      # Deploy tetap lewat Vercel (terhubung ke root dir apps/web),
      # workflow ini cuma gate lint/typecheck/build sebelum merge.
