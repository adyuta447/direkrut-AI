name: api-go-ci

on:
  pull_request:
    paths:
      - "apps/api-go/**"
      - ".github/workflows/api-go-ci.yml"
  push:
    branches: [main, prod]
    paths:
      - "apps/api-go/**"

defaults:
  run:
    working-directory: apps/api-go

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api-go/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Build & push container image
        working-directory: apps/api-go
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:push web -a direkrut-ai-api-go

      - name: Release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:release web -a direkrut-ai-api-go
