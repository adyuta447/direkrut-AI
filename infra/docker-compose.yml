# Dependensi infra buat development lokal: Postgres+pgvector, Redis,
# dan MinIO (object storage kompatibel S3 buat CV & rekaman audio).
# apps/api-go dan apps/ai-engine dijalankan manual (go run / uvicorn)
# selama development biar hot-reload cepat; compose ini cuma nyediain
# storage layer-nya.
#
# Jalankan: docker compose -f infra/docker-compose.yml up -d
name: direkrut-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: direkrut
      POSTGRES_PASSWORD: direkrut
      POSTGRES_DB: direkrut_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U direkrut -d direkrut_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
